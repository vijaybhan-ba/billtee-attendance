<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billtee Attendance 2026-27</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#f2f5fa;color:#1c2733;min-height:100vh;display:flex;flex-direction:column}
header{background:#2f5496;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:1.1rem}
nav button{background:none;border:none;color:#dce6f7;font-weight:700;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.9rem}
nav button.on,nav button:hover{background:rgba(255,255,255,.18);color:#fff}
main{flex:1;padding:18px;max-width:1100px;width:100%;margin:0 auto}
h2{margin-bottom:4px}h3{margin:18px 0 8px}
.sub{color:#5a6b80;margin-bottom:14px;font-size:.9rem}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(20,40,80,.12);margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(20,40,80,.12)}
th,td{padding:7px 8px;text-align:left;font-size:.88rem}
th{background:#2f5496;color:#fff}tr:nth-child(even) td{background:#f6f8fc}
td.c,th.c{text-align:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:700}
.badge.office{background:#c6efce;color:#1e6b34}.badge.outside{background:#bdd7ee;color:#1f4e79}
.badge.absent{background:#f2dcdb;color:#9c2b23}.badge.done{background:#c6efce;color:#1e6b34}
.badge.leave{background:#ffe699;color:#7a5c00}.badge.holiday{background:#e6e6e6;color:#555}
button.btn{background:#e8edf6;border:1px solid #c6d2e6;color:#1c2733;padding:8px 14px;border-radius:7px;font-weight:600;cursor:pointer}
button.btn:hover{background:#dce6f7}
button.primary{background:#2f5496;border-color:#2f5496;color:#fff}
button.danger{background:#f2dcdb;border-color:#d8a6a1;color:#9c2b23}
input,select,textarea{padding:8px;border:1px solid #c6d2e6;border-radius:7px;font-size:.92rem}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
video{width:300px;max-width:100%;border-radius:10px;background:#101826;margin-top:10px;display:block}
.msg{margin-top:10px;font-weight:600;min-height:1.2em}.msg.ok{color:#1e6b34}.msg.err{color:#9c2b23}
td.in{background:#c6efce!important;color:#1e6b34;font-weight:700}
td.out{background:#bdd7ee!important;color:#1f4e79;font-weight:700}
td.abs{color:#b98a86}td.lv{background:#ffe699!important;color:#7a5c00;font-weight:700}
td.hol{background:#e6e6e6!important;color:#555;font-weight:700}
footer{background:#22303f;color:#b9c6d6;padding:10px 18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem}
footer a{color:#8ab4f8}
label{font-weight:600;display:block;margin:8px 0 4px}
.hidden{display:none}
img.face{height:38px;border-radius:6px}
</style>
</head>
<body>
<header>
  <h1 id="hdr">🗓️ Billtee Attendance 2026-27</h1>
  <nav id="nav">
    <button data-t="dash" class="on">Dashboard</button>
    <button data-t="check">Check-In</button>
    <button data-t="emps">Employees</button>
    <button data-t="rep">Reports</button>
    <button data-t="set">Settings</button>
    <button id="adm-btn" onclick="adminToggle()">🔒 Admin</button>
  </nav>
</header>
<main>
<section id="t-dash"></section>
<section id="t-check" class="hidden"></section>
<section id="t-emps" class="hidden"></section>
<section id="t-rep" class="hidden"></section>
<section id="t-set" class="hidden"></section>
</main>
<footer><span>Face-capture attendance · 1 person = 1 entry/day · shared monthly register · Sunday = holiday</span><a id="gh" href="#" target="_blank" rel="noopener"></a></footer>

<script>
"use strict";
const KEY="billtee_attendance_v7";
const REPO="vijaybhan-ba/billtee-attendance";
const NAMES=["Ajit","Shyam","Nikhat","Nitish","Manish","Anshuman","Sarad","Vijay"];
const CODES=[,"1111","2222","9999","3333","4444","5555","6666","0000"];
let MEM=null;
function lsGet(){try{return localStorage.getItem(KEY);}catch(e){return MEM;}}
function lsSet(v){MEM=v;try{localStorage.setItem(KEY,v);}catch(e){}}
function lsDel(){MEM=null;try{localStorage.removeItem(KEY);}catch(e){}}
function freshState(){
  return {
    config:{company:"Billtee",year:"2026-27",github:"https://github.com/"+REPO,cycle:"2026-04-01",
      offices:{Andheri:{lat:19.1117,lon:72.8546},Ambadi:{lat:19.7577,lon:72.7454}},radius:300,cfgVer:2,
      adminPin:"7777",sync:true,topic:"billtee-attendance-vj-2026",token:""},
    employees:NAMES.map((n,i)=>({id:i+1,name:n,grp:i<4?"A":"B",fp:CODES[i+1],
      loc:[,"Ambadi","Andheri","Andheri","Ambadi","Ambadi","Andheri","Ambadi","Andheri"][i+1],face:null})),
    attendance:{}
  };
}
function load(){
  try{const s=JSON.parse(lsGet());if(s&&s.employees)return s;}catch(e){}
  for(const old of ["billtee_attendance_v7","billtee_attendance_v6","billtee_attendance_v5"]){
    try{
      const o=JSON.parse(localStorage.getItem(old));
      if(o&&o.employees){const s=freshState();s.attendance=o.attendance||{};
        s.employees=o.employees.map((e,i)=>Object.assign({},s.employees[i],e));
        if(o.config)Object.assign(s.config,{adminPin:o.config.adminPin,topic:o.config.topic});
        return s;}
    }catch(e){}
  }
  return freshState();
}
let S=load();
if(!S.config.cfgVer||S.config.cfgVer<2){S.config.offices.Andheri={lat:19.1117,lon:72.8546};S.config.radius=300;S.config.cfgVer=2;}
function save(){lsSet(JSON.stringify(S));}
let ADMIN=false;
try{ADMIN=sessionStorage.getItem("billtee_admin")==="1";}catch(e){}
const $=id=>document.getElementById(id);
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const isSunday=day=>new Date(day+"T00:00:00").getDay()===0;
function shiftMonth(m,d){let[y,mo]=m.split("-").map(Number);mo+=d;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+"-"+String(mo).padStart(2,"0");}
function duty(emp,day){
  if(isSunday(day))return{location:"Holiday",label:"Holiday (Sunday)"};
  const start=new Date(S.config.cycle+"T00:00:00"),d=new Date(day+"T00:00:00");
  const pos=Math.round((d-start)/864e5)%6,aIn=pos<3;
  const office=emp.grp==="A"?aIn:!aIn;
  return office?{location:"Office",label:"Office – "+emp.loc}:{location:"Outside",label:"Outside"};
}
function dl(name,mime,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();}
/* ---------- geo ---------- */
function haversine(a,b){const R=6371000,rad=x=>x*Math.PI/180;
  const dLa=rad(b.lat-a.lat),dLo=rad(b.lon-a.lon);
  const s=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));}
function geoOnce(high){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  let done=false;const t=setTimeout(()=>{if(!done){done=true;res(null);}},4000);
  navigator.geolocation.getCurrentPosition(p=>{if(!done){done=true;clearTimeout(t);res({lat:p.coords.latitude,lon:p.coords.longitude});}},
    ()=>{if(!done){done=true;clearTimeout(t);res(null);}},{enableHighAccuracy:high,timeout:3500,maximumAge:high?30000:120000});
});}
async function getGeo(){let g=await geoOnce(false);if(!g)g=await geoOnce(true);return g;}
async function reverseName(g){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${g.lat}&lon=${g.lon}&zoom=14&accept-language=en`);
    const j=await r.json();const a=j.address||{};
    return a.suburb||a.neighbourhood||a.village||a.town||a.city||a.county||(`${g.lat.toFixed(2)}, ${g.lon.toFixed(2)}`);
  }catch(e){return `${g.lat.toFixed(2)}, ${g.lon.toFixed(2)}`;}
}
async function classify(g,emp){
  const ofs=S.config.offices,rad=+S.config.radius||500;
  let best=null,bd=1e12;
  for(const[name,c]of Object.entries(ofs)){const d=haversine(c,g);if(d<bd){bd=d;best=name;}}
  if(bd<=rad)return{location:"Office",branch:best,place:best+" office",auto:true};
  return{location:"Outside",branch:emp.loc,place:await reverseName(g),auto:true};
}
/* ---------- shared register: ntfy live feed + GitHub data file ---------- */
let DB={v:7,days:{},dels:{}};
const DATA_URL=`https://${REPO.split("-ba")[0]}-ba.github.io/${REPO.split("/")[1]}/data/attendance.json`;
function publish(obj){
  if(!S.config.sync)return;
  try{fetch(`https://ntfy.sh/${S.config.topic}`,{method:"POST",body:JSON.stringify(obj)}).catch(()=>{});}catch(e){}
}
async function fetchFeed(){
  try{
    const r=await fetch(`https://ntfy.sh/${S.config.topic}/json?poll=1&since=13h`);
    const txt=await r.text();
    const out={att:{},del:{}};
    txt.split("\n").forEach(line=>{
      if(!line.trim())return;
      try{
        const ev=JSON.parse(line);
        if(!ev.message)return;
        const m=JSON.parse(ev.message);
        if(m.type==="att")out.att[m.date+"_"+m.id]=m;
        if(m.type==="del"){delete out.att[m.date+"_"+m.id];out.del[m.date+"_"+m.id]=1;}
      }catch(e){}
    });
    return out;
  }catch(e){return null;}
}
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);}
async function loadDB(){
  try{
    const r=await fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){const j=await r.json();if(j&&j.days)DB=j;}
  }catch(e){}
}
function mergeDBtoLocal(){
  let changed=false;
  for(const[day,recs]of Object.entries(DB.days||{})){
    for(const[id,rec]of Object.entries(recs)){
      const k=day+"_"+id;
      if(DB.dels&&DB.dels[k])continue;
      if(!(S.attendance[day]||{})[id]){(S.attendance[day]||(S.attendance[day]={}))[id]=rec;changed=true;}
    }
  }
  for(const k of Object.keys(DB.dels||{})){
    const[day,id]=k.split("_");
    if((S.attendance[day]||{})[id]){delete S.attendance[day][+id];changed=true;}
  }
  if(changed)save();
}
function sharedRec(rec){
  const o={time:rec.time,method:rec.method,location:rec.location,branch:rec.branch,place:rec.place};
  if(rec.lv)o.lv=rec.lv;
  if(rec.thumb)o.thumb=rec.thumb;
  return o;
}
async function pushDB(){
  const tk=S.config.token;if(!tk)return false;
  try{
    const url=`https://api.github.com/repos/${REPO}/contents/data/attendance.json`;
    const g=await fetch(url,{headers:{Authorization:"Bearer "+tk,Accept:"application/vnd.github+json"}});
    let sha=null;if(g.ok){const j=await g.json();sha=j.sha;}
    const body={message:"attendance register "+new Date().toISOString(),branch:"main",
      content:btoa(unescape(encodeURIComponent(JSON.stringify(DB))))};
    if(sha)body.sha=sha;
    const r=await fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+tk,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
    return r.ok||r.status===201||r.status===200;
  }catch(e){return false;}
}
let archiving=false;
async function archive(){
  if(archiving)return;archiving=true;
  try{
    let changed=false;
    for(const[day,recs]of Object.entries(S.attendance)){
      for(const[id,rec]of Object.entries(recs)){
        const k=day+"_"+id;
        if(DB.dels&&DB.dels[k])continue;
        if(!(DB.days[day]||{})[id]){(DB.days[day]||(DB.days[day]={}))[id]=sharedRec(rec);changed=true;}
      }
    }
    const feed=await withTimeout(fetchFeed(),2500);
    if(feed){
      for(const m of Object.values(feed.att)){
        const k=m.date+"_"+m.id;
        if(DB.dels&&DB.dels[k])continue;
        const cur=(DB.days[m.date]||{})[m.id];
        if(!cur){(DB.days[m.date]||(DB.days[m.date]={}))[m.id]={time:m.time,method:m.method,location:m.location,branch:m.branch,place:m.place,lv:m.lv,thumb:m.thumb};changed=true;}
        else if(m.location!=="…"&&cur.location==="…"){Object.assign(cur,{location:m.location,place:m.place,branch:m.branch});changed=true;}
      }
      for(const k of Object.keys(feed.del)){if(!DB.dels[k]){(DB.dels||(DB.dels={}))[k]=1;delete (DB.days[k.split("_")[0]]||{})[+k.split("_")[1]];changed=true;}}
    }
    if(changed&&S.config.token){await pushDB();}
  }finally{archiving=false;}
}
async function syncNow(){
  await loadDB();mergeDBtoLocal();
  await archive();
}
async function loadFeed(){
  const feed=await withTimeout(fetchFeed(),6000);
  const box=$("feed");if(!box)return;
  const t=todayStr();
  let rows=[];
  const day=S.attendance[t]||{};
  S.employees.forEach(e=>{if(day[e.id])rows.push(Object.assign({id:e.id,name:e.name},day[e.id]));});
  if(feed)Object.values(feed.att).forEach(m=>{
    if(m.date===t&&!rows.find(r=>r.id===m.id))rows.push(m);
    if(m.date===t){const r=rows.find(x=>x.id===m.id);if(r&&r.location==="…"&&m.location!=="…")Object.assign(r,{location:m.location,place:m.place});}
  });
  rows=rows.filter(r=>!(DB.dels||{})[t+"_"+r.id]);
  rows.sort((a,b)=>a.time<b.time?-1:1);
  let h=`<table><tr><th class="c">#</th><th>Name</th><th class="c">Time</th><th class="c">Method</th><th>Location (live GPS)</th><th class="c">Face</th></tr>`;
  if(!rows.length)h+=`<tr><td colspan="6" class="c">Nobody yet today.</td></tr>`;
  rows.forEach(m=>{
    const lbl=m.location==="Office"?"Office – "+m.branch:m.location==="Leave"?"On leave – "+(LVN[m.lv]||"LV"):m.location==="…"?"📡 locating…":"Outside"+(m.place?" – "+m.place:"");
    h+=`<tr><td class="c">${m.id}</td><td>${m.name}</td><td class="c">${m.time}</td><td class="c">${m.method}</td><td><span class="badge ${m.location==="Office"?"office":m.location==="Leave"?"leave":"outside"}">${lbl}</span></td><td class="c">${m.thumb||m.photo?`<img class="face" src="${m.thumb||m.photo}">`:"—"}</td></tr>`;
  });
  box.innerHTML=h+"</table>";
}
/* ---------- nav / admin ---------- */
function adminToggle(){
  if(ADMIN){ADMIN=false;try{sessionStorage.removeItem("billtee_admin");}catch(e){}
    $("adm-btn").textContent="🔒 Admin";render(curTab());return;}
  const p=prompt("Admin PIN:");
  if(p===S.config.adminPin){ADMIN=true;try{sessionStorage.setItem("billtee_admin","1");}catch(e){}
    $("adm-btn").textContent="🔓 Admin";render(curTab());}
  else if(p!==null)alert("Wrong PIN. Ask the admin.");
}
function curTab(){const b=document.querySelector("#nav button.on");return b?b.dataset.t:"dash";}
$("nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.id==="adm-btn")return;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["dash","check","emps","rep","set"].forEach(t=>$("t-"+t).classList.toggle("hidden",t!==b.dataset.t));
  render(b.dataset.t);
});
function lockCard(what){
  return `<div class="card">🔐 <b>${what} is admin-only.</b> Tap <b>🔒 Admin</b> at the top and enter the admin PIN (known only to the admin).</div>`;
}
/* ---------- labels ---------- */
const LVN={SL:"Sick",PL:"Planned",CL:"Casual",LV:"Leave"};
function recLabel(m,e){
  if(!m)return null;
  if(m.location==="…")return "📡 locating…";
  if(m.location==="Office")return "Office – "+(m.branch||e.loc);
  if(m.location==="Outside")return "Outside"+(m.place?" – "+m.place:"");
  if(m.location==="Leave")return "On leave ("+(LVN[m.lv]||"LV")+")";
  return m.location;
}
/* ---------- dashboard ---------- */
function renderDash(){
  const t=todayStr(),day=S.attendance[t]||{},sun=isSunday(t);
  let h=`<h2>Dashboard — ${t}${sun?" (Holiday – Sunday)":""}</h2><p class="sub">Shared register: every phone sees the same present/absent list.</p>
  <table><tr><th class="c">#</th><th>Employee</th><th class="c">Team</th><th class="c">Duty</th><th>Status (all phones)</th></tr>`;
  S.employees.forEach(e=>{
    const du=duty(e,t),m=day[e.id];
    h+=`<tr><td class="c">${e.id}</td><td>${e.name}</td><td class="c">${e.grp}</td>
    <td class="c"><span class="badge ${du.location==="Office"?"office":du.location==="Holiday"?"holiday":"outside"}">${du.label}</span></td>
    <td>${m?`<span class="badge ${m.location==="Office"?"done":m.location==="Leave"?"leave":"outside"}">${recLabel(m,e)} · ${m.method} @ ${m.time}</span>${(m.location==="Office")!==(du.location==="Office")&&du.location!=="Holiday"?` <span class="badge absent">duty was: ${du.location}</span>`:""}`
      :sun?`<span class="badge holiday">Holiday</span>`:`<span class="badge absent">Not present / absent</span>`}</td></tr>`;
  });
  h+=`</table><h3>🌐 Present today (live, all phones)</h3><div id="feed"><p class="sub">Loading…</p></div>`;
  $("t-dash").innerHTML=h;
  loadFeed();
}
/* ---------- check-in ---------- */
let stream=null;
async function doSync(){await syncNow();render(curTab());const m=$("rp-msg")||$("st-msg");if(m){m.textContent="Shared register synced.";m.className="msg ok";}}
function renderCheck(){
  const t=todayStr(),day=S.attendance[t]||{};
  let h=`<h2>Check-In — ${t}${isSunday(t)?" (Holiday – Sunday)":""}</h2><div class="card">
  <label>Employee</label><select id="ck-emp">${S.employees.map(e=>`<option value="${e.id}">${e.id}. ${e.name}</option>`).join("")}</select>
  <p class="msg ok" id="ck-duty"></p>
  <label>🔐 Your secret code (only you know it)</label>
  <input id="ck-code" placeholder="your code" inputmode="numeric" style="width:140px" type="password">
  <label>Where are you now? (used only if GPS is unavailable)</label>
  <select id="ck-loc"><option value="outside" selected>🌆 Outside (not at my office)</option><option id="ck-loc-office" value="office">🏢 At my office</option></select>
  <video id="cam" autoplay playsinline muted></video>
  <div class="row"><button class="btn" onclick="camStart()">🎥 Start Camera</button>
  <button class="btn primary" onclick="faceIn()">📸 Face Capture + Live Location</button></div>
  <div class="row"><span style="font-weight:600">🏖️ Leave — choose type:</span>
  <input id="ck-date" type="date" value="${t}" style="width:160px" title="Planned leave date">
  <button class="btn" onclick="leaveIn('SL')">🤒 Sick</button>
  <button class="btn" onclick="leaveIn('PL',true)">📅 Planned</button>
  <button class="btn" onclick="leaveIn('CL')">🏖️ Casual</button>
  <button class="btn" onclick="cancelPL()">❌ Cancel Planned Leave</button></div>
  <p class="msg" id="ck-msg"></p></div>
  <h3>Today's entries (all phones)</h3><table><tr><th class="c">#</th><th>Name</th><th class="c">Time</th><th class="c">Method</th><th class="c">Location (auto)</th><th class="c">Face</th>${ADMIN?'<th class="c">✖</th>':""}</tr>`;
  S.employees.forEach(e=>{const m=day[e.id];if(m)h+=`<tr><td class="c">${e.id}</td><td>${e.name}</td><td class="c">${m.time}</td><td class="c">${m.method}</td><td class="c"><span class="badge ${m.location==="Office"?"office":m.location==="Leave"?"leave":"outside"}">${recLabel(m,e)}</span></td><td class="c">${m.photo||m.thumb?`<img class="face" src="${m.photo||m.thumb}">`:"—"}</td>${ADMIN?`<td class="c"><button class="btn danger" onclick="delRec(${e.id})">✖</button></td>`:""}</tr>`;});
  let ups=[];
  for(const[day,recs]of Object.entries(S.attendance)){if(day>=t)for(const[id,r]of Object.entries(recs)){if(r.location==="Leave"&&r.lv==="PL")ups.push({day,id:+id});}}
  ups.sort((a,b)=>a.day<b.day?-1:1);
  if(ups.length){h+=`<h3>📅 Planned leaves (today & future)</h3><table><tr><th>Date</th><th class="c">#</th><th>Name</th><th class="c">Action</th></tr>`;
    ups.forEach(u=>{const e=S.employees.find(x=>x.id===u.id);h+=`<tr><td>${u.day}</td><td class="c">${u.id}</td><td>${e?e.name:"?"}</td><td class="c"><button class="btn" onclick="setDateCancel('${u.day}',${u.id})">❌ Cancel (with ${e?e.name:""}'s code)</button></td></tr>`;});
    h+="</table>";}
  h+=`<h3>🌐 Live team today (all phones)</h3><div id="feed"><p class="sub">Loading…</p></div>`;
  $("t-check").innerHTML=h;
  $("ck-emp").onchange=showDuty;showDuty();
  loadFeed();
}
function showDuty(){const e=S.employees.find(x=>x.id==+$("ck-emp").value);$("ck-duty").textContent="Today's duty: "+duty(e,todayStr()).label;const o=$("ck-loc-office");if(o)o.textContent="🏢 At "+e.loc+" office (I am really here)";}
function curEmp(){return S.employees.find(x=>x.id==+$("ck-emp").value);}
function checkCode(emp){
  const c=($("ck-code")?$("ck-code").value:"").trim();
  if(c!==emp.fp){const m=$("ck-msg");m.textContent=`🔐 Wrong secret code for ${emp.name}. Nobody else can mark ${emp.name}'s attendance.`;m.className="msg err";return false;}
  return true;
}
async function dupBlock(emp,t){
  if((S.attendance[t]||{})[emp.id])return `❌ ${emp.name} is ALREADY entered today (this phone). One person = one entry per day.`;
  if((DB.days[t]||{})[emp.id])return `❌ ${emp.name} is ALREADY entered today in the shared register. One person = one entry per day.`;
  const feed=await withTimeout(fetchFeed(),2500);
  if(feed){
    const o=Object.values(feed.att).find(m=>m.date===t&&m.id===emp.id);
    if(o&&!feed.del[t+"_"+emp.id])return `❌ ${emp.name} already enrolled today at ${o.time} from another phone. One person = one entry per day.`;
  }
  return null;
}
async function autoPlace(emp){
  const g=await getGeo();
  if(g)return classify(g,emp);
  const w=($("ck-loc")?$("ck-loc").value:"outside")==="office";
  return{location:w?"Office":"Outside",branch:emp.loc,place:w?emp.loc+" office":null,auto:false};
}
function put(emp,rec,date){
  const t=date||todayStr();
  (S.attendance[t]||(S.attendance[t]={}))[emp.id]=rec;
  if(rec.photo)emp.face=rec.photo;
  save();
  (DB.days[t]||(DB.days[t]={}))[emp.id]=sharedRec(rec);
  publish({type:"att",date:t,id:emp.id,name:emp.name,time:rec.time,method:rec.method,location:rec.location,branch:rec.branch,place:rec.place,lv:rec.lv,thumb:rec.thumb});
  archive();
}
function delRec(id){
  if(!ADMIN)return;
  const t=todayStr();
  if(S.attendance[t]&&S.attendance[t][id]){
    const e=S.employees.find(x=>x.id===id);
    delete S.attendance[t][id];
    delete (DB.days[t]||{})[id];
    (DB.dels||(DB.dels={}))[t+"_"+id]=1;
    save();
    publish({type:"del",date:t,id});
    archive();
    renderCheck();
    const m=$("ck-msg");m.textContent=`🗑️ Admin removed ${e.name}'s entry for ${t}. ${e.name} can enter again.`;m.className="msg ok";
  }
}
async function checkIn(method,img,thumb){
  const emp=curEmp();
  if(!checkCode(emp))return;
  const t=todayStr();
  const dup=await dupBlock(emp,t);
  if(dup){const m=$("ck-msg");m.textContent=dup;m.className="msg err";return;}
  const rec={time:new Date().toTimeString().slice(0,8),method,photo:img,thumb:thumb||null,
    location:"…",branch:emp.loc,place:"📡 locating…",auto:false};
  put(emp,rec);renderCheck();
  const m=$("ck-msg");m.textContent=`✔ ${emp.name} present — 📡 fetching live location…`;m.className="msg ok";
  const pl=await autoPlace(emp);
  Object.assign(rec,pl);
  Object.assign((DB.days[t]||{})[emp.id]||{},sharedRec(rec));
  save();
  publish({type:"att",date:t,id:emp.id,name:emp.name,time:rec.time,method:rec.method,location:rec.location,branch:rec.branch,place:rec.place,lv:rec.lv,thumb:rec.thumb});
  archive();
  renderCheck();
  const mm=$("ck-msg");mm.textContent=`✔ ${emp.name} present — ${recLabel(rec,emp)} at ${rec.time.slice(0,5)}${pl.auto?" (live GPS)":""}. Name now locked for today.`;mm.className="msg ok";
}
async function faceIn(){
  const v=$("cam");if(!v.videoWidth){const m=$("ck-msg");m.textContent="Start the camera first, then capture your face.";m.className="msg err";return;}
  const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
  let img=null,thumb=null;
  try{img=c.toDataURL("image/jpeg",.6);
    const tc=document.createElement("canvas");tc.width=48;tc.height=48;tc.getContext("2d").drawImage(v,0,0,48,48);
    thumb=tc.toDataURL("image/jpeg",.4);}catch(e){}
  checkIn("face",img,thumb);
}
async function leaveIn(lv,useDate){
  const emp=curEmp();if(!checkCode(emp))return;
  const t=useDate&&$("ck-date")&&$("ck-date").value?$("ck-date").value:todayStr();
  const dup=await dupBlock(emp,t);
  if(dup){const m=$("ck-msg");m.textContent=dup;m.className="msg err";return;}
  const names={SL:"Sick leave",PL:"Planned leave",CL:"Casual leave"};
  put(emp,{time:new Date().toTimeString().slice(0,8),method:"leave",location:"Leave",lv:lv||"LV",branch:emp.loc,place:names[lv]||"leave",photo:null,thumb:null,auto:false},t);
  renderCheck();
  const m=$("ck-msg");m.textContent=`🏖️ ${emp.name} — ${names[lv]||"leave"} recorded for ${t}.`+(t===todayStr()?" Name now locked for today.":"");m.className="msg ok";
}
async function cancelPL(){
  const emp=curEmp();
  if(!checkCode(emp))return;
  const t=($("ck-date")&&$("ck-date").value)||todayStr();
  const isPL=r=>r&&r.location==="Leave"&&r.lv==="PL";
  let found=isPL((S.attendance[t]||{})[emp.id])||isPL((DB.days[t]||{})[emp.id]);
  if(!found){
    const feed=await withTimeout(fetchFeed(),2500);
    if(feed&&!feed.del[t+"_"+emp.id])found=isPL(Object.values(feed.att).find(m=>m.date===t&&m.id===emp.id));
  }
  if(!found){const m=$("ck-msg");m.textContent=`ℹ️ ${emp.name} has no planned leave on ${t} — nothing to cancel.`;m.className="msg err";return;}
  if(S.attendance[t])delete S.attendance[t][emp.id];
  if(DB.days[t])delete DB.days[t][emp.id];
  (DB.dels||(DB.dels={}))[t+"_"+emp.id]=1;
  save();
  publish({type:"del",date:t,id:emp.id});
  archive();
  renderCheck();
  const m=$("ck-msg");m.textContent=`🔄 ${emp.name}'s planned leave on ${t} is CANCELLED for everyone. ${emp.name} can now check in.`;m.className="msg ok";
}
function setDateCancel(day,id){const e=$("ck-emp");if(e)e.value=String(id);const d=$("ck-date");if(d)d.value=day;cancelPL();}
function camStart(){
  if(!navigator.mediaDevices){const m=$("ck-msg");m.textContent="No camera here — download this file and open in your browser for camera+GPS.";m.className="msg err";return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(s=>{stream=s;$("cam").srcObject=s;}).catch(()=>{const m=$("ck-msg");m.textContent="Camera blocked.";m.className="msg err";});
}
/* ---------- employees ---------- */
function renderEmps(){
  if(!ADMIN){$("t-emps").innerHTML=lockCard("Employees");return;}
  let h=`<h2>Employees (admin)</h2><p class="sub">Codes hidden — 👁 reveals; tell each employee privately.</p>
  <table><tr><th class="c">#</th><th>Name</th><th class="c">Team</th><th class="c">Main office</th><th>Secret code</th><th class="c">Face</th></tr>`;
  S.employees.forEach(e=>{
    h+=`<tr><td class="c">${e.id}</td><td>${e.name}</td>
    <td class="c"><select onchange="updEmp(${e.id},{grp:this.value})"><option ${e.grp==="A"?"selected":""}>A</option><option ${e.grp==="B"?"selected":""}>B</option></select></td>
    <td class="c"><select onchange="updEmp(${e.id},{loc:this.value})"><option ${e.loc==="Andheri"?"selected":""}>Andheri</option><option ${e.loc==="Ambadi"?"selected":""}>Ambadi</option></select></td>
    <td><input id="code-${e.id}" value="${e.fp}" type="password" style="width:90px" onchange="updEmp(${e.id},{fp:this.value})"> <button class="btn" onclick="peek(${e.id})">👁</button></td>
    <td class="c">${e.face?"✅":"—"} <button class="btn" onclick="enrollPrompt(${e.id})">Enroll</button></td></tr>`;
  });
  h+=`</table><div class="row"><button class="btn primary" onclick="addEmp()">➕ Add employee (auto code)</button></div>`;
  $("t-emps").innerHTML=h;
}
function addEmp(){
  if(!ADMIN)return;
  const n=prompt("New employee name:");if(!n||!n.trim())return;
  const id=Math.max.apply(null,S.employees.map(e=>e.id))+1;
  let fp;do{fp=String(Math.floor(1000+Math.random()*9000));}while(S.employees.some(e=>e.fp===fp));
  S.employees.push({id,name:n.trim(),grp:"B",fp,loc:"Ambadi",face:null});
  save();renderEmps();
  alert("Added "+n.trim()+" — #"+id+" with secret code "+fp+". Tell them privately.");
}
function peek(id){const i=$("code-"+id);if(i)i.type=i.type==="password"?"text":"password";}
function updEmp(id,patch){if(!ADMIN)return;const e=S.employees.find(x=>x.id===id);Object.assign(e,patch);save();renderEmps();}
function enrollPrompt(id){
  const e=S.employees.find(x=>x.id===id);
  if(!navigator.mediaDevices){alert("No camera in this viewer. Download this file and open in your browser to enroll faces.");return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(s=>{
    const v=document.createElement("video");v.srcObject=s;v.muted=true;v.play();
    setTimeout(()=>{const c=document.createElement("canvas");c.width=v.videoWidth||320;c.height=v.videoHeight||240;
      c.getContext("2d").drawImage(v,0,0);s.getTracks().forEach(t=>t.stop());
      try{e.face=c.toDataURL("image/jpeg",.5);save();}catch(err){}
      renderEmps();},700);
  }).catch(()=>alert("Camera blocked."));
}
/* ---------- reports ---------- */
function renderRep(){
  const m=todayStr().slice(0,7);
  $("t-rep").innerHTML=`<h2>Reports — full month (shared register)</h2>
  <div class="row" style="margin:0 0 14px"><input type="month" id="rp-m" value="${m}">
  <button class="btn primary" onclick="repGrid()">Show</button>
  <button class="btn" onclick="repCSV(1)">⬇️ Excel CSV — 1 month</button>
  <button class="btn" onclick="repCSV(2)">⬇️ Excel CSV — 2 months</button>
  <button class="btn" onclick="backup()">💾 Backup (JSON)</button>
  ${ADMIN?'<button class="btn" onclick="doSync()">🔄 Sync now</button>':""}</div>
  <p class="sub">AND = Andheri · AMB = Ambadi · OUT = outside · SL = sick · PL = planned · CL = casual · H = Sunday · — = absent</p>
  <div id="rp-grid" style="overflow-x:auto"></div><div id="rp-msg" class="msg"></div>
  <pre id="rp-out" style="display:none;max-height:220px;overflow:auto;background:#101826;color:#cfe3ff;border-radius:8px;padding:8px;margin-top:10px;font-size:.7rem"></pre>`;
  repGrid();
}
function cellFor(rec,e,day){
  if(rec&&rec.location==="…")return{v:"…",cls:"out",t:"locating…"};
  if(rec){
    if(rec.location==="Office")return{v:(rec.branch||e.loc)==="Andheri"?"AND":"AMB",cls:"in",t:rec.method+" @ "+rec.time};
    if(rec.location==="Leave")return{v:rec.lv||"LV",cls:"lv",t:(LVN[rec.lv]||"")+" leave"};
    return{v:"OUT",cls:"out",t:(rec.place||"outside")+" · "+rec.method+" @ "+rec.time};
  }
  if(isSunday(day))return{v:"H",cls:"hol",t:"Sunday holiday"};
  return{v:"—",cls:"abs",t:""};
}
function gridFor(m){
  const [y,mo]=m.split("-").map(Number),nd=new Date(y,mo,0).getDate();
  return S.employees.map(e=>{
    let cells="",P=0,O=0,Out=0,LV=0,A=0;
    for(let d=1;d<=nd;d++){
      const day=`${m}-${String(d).padStart(2,"0")}`;
      const rec=(S.attendance[day]||{})[e.id];
      const c=cellFor(rec,e,day);
      cells+=`<td class="c ${c.cls}" title="${c.t}">${c.v}</td>`;
      if(rec){if(rec.location==="Office"){P++;O++;}else if(rec.location==="Leave"){LV++;}else{P++;Out++;}}
      else if(!isSunday(day))A++;
    }
    return {e,cells,P,O,Out,LV,A};
  });
}
function repGrid(){
  const m=$("rp-m").value,g=gridFor(m);
  const nd=g[0].cells.split("<td").length-1;
  let h=`<table style="font-size:.75rem"><tr><th>#</th><th>Employee</th><th>Office</th>`;
  for(let d=1;d<=nd;d++)h+=`<th class="c">${d}</th>`;
  h+=`<th class="c">P</th><th class="c">Off</th><th class="c">Out</th><th class="c">LV</th><th class="c">Abs</th></tr>`;
  g.forEach(r=>{h+=`<tr><td>${r.e.id}</td><td>${r.e.name}</td><td>${r.e.loc}</td>${r.cells}<td class="c"><b>${r.P}</b></td><td class="c">${r.O}</td><td class="c">${r.Out}</td><td class="c">${r.LV}</td><td class="c">${r.A}</td></tr>`;});
  $("rp-grid").innerHTML=h+"</table>";
}
function monthCSV(m){
  const g=gridFor(m),[y,mo]=m.split("-").map(Number),nd=new Date(y,mo,0).getDate();
  let csv=`${S.config.company} Attendance ${S.config.year} - ${m}\n${S.config.github}\nNo,Employee,Team,Main Office`;
  for(let d=1;d<=nd;d++)csv+=","+d;
  csv+=`,Present,Office,Outside,Leave,Absent\n`;
  g.forEach(r=>{
    csv+=`${r.e.id},${r.e.name},${r.e.grp},${r.e.loc}`;
    for(let d=1;d<=nd;d++){
      const day=`${m}-${String(d).padStart(2,"0")}`;
      const rec=(S.attendance[day]||{})[r.e.id];
      const c=cellFor(rec,r.e,day);
      csv+=","+(rec||isSunday(day)?c.v:"");
    }
    csv+=`,${r.P},${r.O},${r.Out},${r.LV},${r.A}\n`;
  });
  return csv;
}
function showOut(text,msg){const o=$("rp-out");if(o){o.style.display="block";o.textContent=text;}
  const mm=$("rp-msg");mm.textContent=msg;mm.className="msg ok";}
function repCSV(n){
  const m=$("rp-m").value,months=n===2?[shiftMonth(m,-1),m]:[m];
  const text=months.map(monthCSV).join("\n");
  dl(`attendance_${months[0]}${n===2?"_to_"+months[1]:""}.csv`,"text/csv",text);
  showOut(text,"CSV ready — downloaded, or copy below (paste into Excel).");
}
function backup(){
  const text=JSON.stringify({type:"attendance-backup",company:S.config.company,employees:S.employees.map(e=>({id:e.id,name:e.name,grp:e.grp,loc:e.loc,fp:e.fp})),attendance:S.attendance},null,2);
  dl(`backup_${todayStr()}.json`,"application/json",text);
  showOut(text,"Backup ready — downloaded, or copy below. Send to admin on WhatsApp if asked.");
}
function importBackup(){
  const txt=prompt("Paste the backup JSON received from an employee:");
  if(!txt)return;
  try{
    const b=JSON.parse(txt);
    let n=0;
    for(const[day,recs]of Object.entries(b.attendance||{})){
      for(const[id,rec]of Object.entries(recs)){
        if(!(S.attendance[day]||{})[id]&&!(DB.dels||{})[day+"_"+id]){(S.attendance[day]||(S.attendance[day]={}))[id]=rec;n++;}
      }
    }
    save();archive();
    alert(`Imported ${n} new entries into the shared register.`);
    render(curTab());
  }catch(e){alert("Not a valid backup JSON.");}
}

  <label>GitHub link</label><input id="st-g" value="${c.github}" style="width:100%">
  <label>Rotation cycle start</label><input id="st-s" type="date" value="${c.cycle}">
  <label>🔐 Admin PIN (never shown to employees)</label><input id="st-pin" value="${c.adminPin}" type="password" style="width:120px"> <button class="btn" onclick="const i=$('st-pin');i.type=i.type==='password'?'text':'password'">👁</button>
  <label>Andheri office GPS (lat, lon)</label>
  <div class="row" style="margin:0"><input id="st-alat" value="${o.Andheri.lat}" style="width:120px"><input id="st-alon" value="${o.Andheri.lon}" style="width:120px"></div>
  <label>Ambadi office GPS (lat, lon)</label>

  <button class="btn" onclick="if(confirm('Reset ALL data on this phone?')){lsDel();location.reload();}">Reset data</button></div>
  <p class="msg" id="st-msg"></p></div>`;
}
function closeFresh(){
  if(!ADMIN)return;
  if(!confirm("First download a backup, then clear ALL attendance and start fresh from today?"))return;
  backup();
  S.attendance={};save();
  DB={v:7,days:{},dels:{}};
  if(S.config.token)pushDB();
  alert("Past closed. Backup downloaded. Starting fresh from today.");
  render(curTab());
}
function saveSet(){
  if(!ADMIN)return;
  S.config.company=$("st-c").value.trim()||S.config.company;
  S.config.github=$("st-g").value.trim()||S.config.github;
  S.config.cycle=$("st-s").value||S.config.cycle;
  S.config.adminPin=$("st-pin").value.trim()||S.config.adminPin;
  S.config.radius=+$("st-rad").value||S.config.radius;
  S.config.topic=$("st-top").value.trim()||S.config.topic;
  S.config.token=$("st-tok").value.trim();
  S.config.offices.Andheri={lat:+$("st-alat").value||S.config.offices.Andheri.lat,lon:+$("st-alon").value||S.config.offices.Andheri.lon};
  S.config.offices.Ambadi={lat:+$("st-blat").value||S.config.offices.Ambadi.lat,lon:+$("st-blon").value||S.config.offices.Ambadi.lon};
  save();chrome();renderSet();
  $("st-msg").textContent="Settings saved.";$("st-msg").className="msg ok";
}
/* ---------- shell ---------- */
function chrome(){
  $("hdr").textContent=`🗓️ ${S.config.company} Attendance ${S.config.year}`;
  document.title=`${S.config.company} Attendance ${S.config.year}`;
  const g=$("gh");g.textContent="GitHub project ↗";g.href=S.config.github;
  const a=$("adm-btn");if(a)a.textContent=ADMIN?"🔓 Admin":"🔒 Admin";
}
function render(t){({dash:renderDash,check:renderCheck,emps:renderEmps,rep:renderRep,set:renderSet})[t]();}
setInterval(()=>{const t=curTab();if(t==="dash"||t==="check")syncNow().then(loadFeed);},30000);
(async()=>{await loadDB();mergeDBtoLocal();chrome();renderDash();})();
</script>
